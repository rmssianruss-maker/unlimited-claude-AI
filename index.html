<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Claude-like AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #f97316;
      --accent-2: #fb923c;
      --border: rgba(255,255,255,0.08);
      --shadow: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      padding: 24px;
    }
    .app {
      width: min(900px, 100%);
      height: min(85vh, 800px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; font-weight: 700;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .status { color: var(--muted); font-size: 13px; }
    .model-select {
      max-width: 220px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--panel-2); color: var(--text);
    }
    .web-search-toggle {
      display: flex; align-items: center; gap: 8px; color: var(--muted);
      font-size: 13px; white-space: nowrap;
    }
    .web-search-toggle input { accent-color: var(--accent); }
    .source-links { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
    .source-links a { color: #93c5fd; font-size: 12px; overflow-wrap: anywhere; }
    .chat {
      flex: 1; overflow-y: auto; padding: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
    }
    .msg {
      display: flex; margin-bottom: 16px;
    }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 75%; padding: 12px 14px; border-radius: 16px; line-height: 1.55;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; border-bottom-right-radius: 6px;
    }
    .msg.bot .bubble {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .composer {
      display: flex; gap: 12px; padding: 16px 18px 18px; border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    textarea {
      flex: 1; min-height: 60px; max-height: 150px; resize: vertical;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      border-radius: 14px; padding: 14px 16px; font-size: 15px;
      outline: none;
    }
    button {
      border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; font-weight: 700; cursor: pointer; border-radius: 14px;
      padding: 0 20px; min-width: 120px;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    @media (max-width: 640px) {
      .bubble { max-width: 90%; }
      .composer { flex-direction: column; }
      button { width: 100%; min-height: 48px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand"><span class="dot"></span> Free Claude-like AI</div>
      <select id="topicSelect" class="model-select" aria-label="Choose topic mode">
        <option value="general">General</option>
        <option value="navier-stokes">Navier–Stokes</option>
        <option value="complexity">P / NP complexity</option>
      </select>
      <select id="modelSelect" class="model-select" aria-label="Choose local model">
        <option>Loading models...</option>
      </select>
    </div>

    <div id="chat" class="chat"></div>

    <div class="composer">
      <label class="web-search-toggle"><input id="webSearch" type="checkbox" /> Search sources</label>
      <textarea id="prompt" placeholder="Ask anything..."></textarea>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const topicSelect = document.getElementById('topicSelect');
    const modelSelect = document.getElementById('modelSelect');
    const webSearchToggle = document.getElementById('webSearch');
    const messages = [];

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Models unavailable');
        modelSelect.replaceChildren(...data.models.map((name) => {
          const option = document.createElement('option');
          option.value = name;
          option.textContent = name;
          return option;
        }));
        if (data.models.includes(data.default)) modelSelect.value = data.default;
        if (!data.models.length) modelSelect.innerHTML = '<option value="">No models installed</option>';
      } catch (error) {
        modelSelect.innerHTML = '<option value="">Ollama unavailable</option>';
      }
    }

    function addMessage(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
      return wrap;
    }

    function addSources(messageNode, sources) {
      if (!Array.isArray(sources) || !sources.length) return;
      const links = document.createElement('div');
      links.className = 'source-links';
      for (const source of sources) {
        try {
          const url = new URL(source.url);
          if (url.protocol !== 'https:') continue;
          const link = document.createElement('a');
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = `${source.provider}: ${source.title}`;
          links.appendChild(link);
        } catch (error) {
          continue;
        }
      }
      if (links.childElementCount) messageNode.appendChild(links);
    }

    async function sendMessage() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      messages.push({ role: 'user', content: prompt });
      promptEl.value = '';
      sendBtn.disabled = true;
      const replyNode = addMessage('bot', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages,
            model: modelSelect.value,
            topic: topicSelect.value,
            web_search: webSearchToggle.checked
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Kërkesa dështoi');
        replyNode.querySelector('.bubble').textContent = data.answer || 'No answer returned.';
        addSources(replyNode, data.sources);
        messages.push({ role: 'assistant', content: data.answer || '' });
      } catch (err) {
        messages.pop();
        const last = chatEl.lastElementChild;
        if (last && last.classList.contains('bot')) {
          last.querySelector('.bubble').textContent = 'Error: ' + err.message;
        } else {
          addMessage('bot', 'Error: ' + err.message);
        }
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    promptEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    addMessage('bot', 'Hello! I am the free local AI. Ask me anything.');
    loadModels();
  </script>
</body>
</html>
